name: Deploy OpenUSD Survival Guide

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install mkdocs-material pymdown-extensions
      - name: Build and Deploy
        run: |
          mkdocs gh-deploy --force
      - name: Ensure CNAME on gh-pages
        run: |
          rm -rf /tmp/ghp && git clone -q --depth 1 -b gh-pages "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" /tmp/ghp
          cd /tmp/ghp
          if [ ! -f CNAME ]; then cp "$GITHUB_WORKSPACE/CNAME" .; git add CNAME; git -c user.name=deploy -c user.email=deploy@bot commit -m "add CNAME"; git push -q origin gh-pages; fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
